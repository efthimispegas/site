name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PEGASOFT_PUBLIC_SITE_URL: ${{ vars.PEGASOFT_PUBLIC_SITE_URL }}
      PEGASOFT_DEPLOYMENT_ENV: development
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.8.1
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec nx format:check
      - run: pnpm exec nx run-many -t lint test typecheck build --parallel=3
      - run: pnpm exec nx run-many -t e2e --parallel=1
      - run: pnpm audit --audit-level high

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-output
          path: |
            apps/**/test-output/**
            apps/**/playwright-report/**
          if-no-files-found: ignore

      - run: pnpm exec nx fix-ci
        if: always()

  deploy-pegasoft:
    # The readiness variable remains unset until the release/content/privacy gates pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PEGASOFT_PRODUCTION_READY == 'true'
    needs: verify
    runs-on: ubuntu-latest
    environment: pegasoft-production
    concurrency:
      group: pegasoft-production
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.8.1
          run_install: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Validate dedicated production project
        env:
          PAGES_PROJECT: ${{ vars.PEGASOFT_PRODUCTION_PAGES_PROJECT }}
          DEVELOPMENT_PROJECT: ${{ vars.PEGASOFT_DEVELOPMENT_PAGES_PROJECT }}
        run: |
          if [ -z "$PAGES_PROJECT" ] || [ -z "$DEVELOPMENT_PROJECT" ] || [ "$PAGES_PROJECT" = "$DEVELOPMENT_PROJECT" ]; then
            echo 'Configure a separate production Pages project; development must be preserved.'
            exit 1
          fi
          if ! printf '%s' "$PAGES_PROJECT" | grep -Eq '^[a-z0-9][a-z0-9-]*$'; then
            echo 'Invalid Pages project name.'
            exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - name: Build canonical production artifact
        run: pnpm exec nx run @site/pegasoft-concept:build
        env:
          PEGASOFT_PUBLIC_SITE_URL: ${{ vars.PEGASOFT_PRODUCTION_SITE_URL }}
          PEGASOFT_PRODUCTION_SITE_URL: ${{ vars.PEGASOFT_PRODUCTION_SITE_URL }}
          PEGASOFT_DEPLOYMENT_ENV: production
          PEGASOFT_INCLUDE_INSPECTORS: 'false'
      - name: Install pinned Cloudflare deployment tooling
        run: pnpm exec nx run @site/pegasoft-intake:install-cloudflare
        env:
          PEGASOFT_PUBLIC_SITE_URL: ${{ vars.PEGASOFT_PRODUCTION_SITE_URL }}
      - name: Deploy verified revision
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: apps/pegasoft-intake/cloudflare-tooling
          wranglerVersion: '4.155.0'
          packageManager: pnpm
          command: pages deploy ../../../dist/apps/pegasoft-concept --project-name=${{ vars.PEGASOFT_PRODUCTION_PAGES_PROJECT }} --branch=main --commit-hash=${{ github.sha }}
