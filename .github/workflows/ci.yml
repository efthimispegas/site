name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          version: 10.8.1
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install chromium --with-deps
      - run: pnpm exec nx format:check
      - run: pnpm exec nx run-many -t lint test typecheck build --parallel=3
      - run: pnpm exec nx run-many -t e2e --parallel=1
      - run: pnpm audit --audit-level high

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-output
          path: |
            apps/**/test-output/**
            apps/**/playwright-report/**
          if-no-files-found: ignore

      - run: pnpm exec nx fix-ci
        if: always()
