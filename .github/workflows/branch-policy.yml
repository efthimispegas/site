name: Branch policy

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: ['**']

permissions:
  contents: read

jobs:
  branch-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
      - run: node --test .github/scripts/branch-policy.test.mjs
      - run: node .github/scripts/branch-policy.mjs
